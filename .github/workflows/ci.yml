name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff format --check app.py src views scripts tests
      - run: python -m ruff check app.py src views scripts tests
      - run: python -m pytest -q
      - run: python -m compileall -q app.py src views scripts tests
